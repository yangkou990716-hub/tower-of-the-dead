<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="亡者之塔">
<meta name="theme-color" content="#0b0e12">
<meta name="description" content="提燈走入倒懸之塔的動作 Roguelike。完全離線可玩。">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<title>亡者之塔：無盡深界</title>
</head>
<body>
<div id="game"></div>
<div id="post"><i class="vig"></i><i class="slow"></i><i class="hurt"></i><i class="fade"></i></div>

<div id="hud" hidden>
  <div class="vit">
    <div class="bar hp"><i></i><b></b><span></span></div>
    <div class="bar sta"><i></i></div>
    <div class="row"><span class="pots"></span><span class="gold"><i></i><b>0</b></span><span class="fx"></span></div>
  </div>
  <div class="tr">
    <div class="where"></div>
    <canvas id="mini" width="252" height="180"></canvas>
    <div class="sys"><button data-act="inv" aria-label="行囊">囊</button><button data-act="map" aria-label="地圖">圖</button><button data-act="pause" aria-label="暫停">停</button></div>
  </div>
  <div class="boss" hidden><span></span><div class="bar"><i></i><b></b></div></div>
  <div class="skills"></div>
  <div class="prompt" hidden></div>
  <div class="banner" hidden><b></b><span></span></div>
  <div class="toasts"></div>
</div>

<div id="touch" hidden>
  <div class="zone zl"><div class="sb"><div class="sk"></div></div></div>
  <div class="zone zr"><div class="sb aim"><div class="sk"></div></div></div>
  <button class="tb dodge" data-b="dodge">閃</button>
  <button class="tb parry" data-b="parry">禦</button>
  <button class="tb heavy" data-b="heavy">蓄</button>
  <button class="tb s1" data-b="s1"><i></i><span>技一</span></button>
  <button class="tb s2" data-b="s2"><i></i><span>技二</span></button>
  <button class="tb potion" data-b="potion"><span>藥</span><b></b></button>
  <button class="tb act" data-b="interact" hidden>互動</button>
</div>

<div id="ui"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
